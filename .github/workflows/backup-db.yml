# Backup diario da base de dados (Supabase / PostgreSQL 17).
#
# O repositorio e PUBLICO: o dump e sempre encriptado (GPG, AES256) antes de
# ser guardado como artifact. Sem a passphrase o ficheiro e ilegivel.
#
# Secrets necessarios (Settings > Secrets and variables > Actions):
#   BACKUP_DATABASE_URL  - connection string do session pooler (porta 5432, = DIRECT_URL)
#   BACKUP_PASSPHRASE    - passphrase longa para encriptar os backups (guardar num gestor de passwords!)
#
# Restaurar:
#   1. Descarregar o artifact "db-backup-..." na pagina do workflow run e extrair o .zip
#   2. gpg --decrypt --output crm.dump crm-AAAA-MM-DD.dump.gpg
#   3. pg_restore --no-owner --no-privileges --clean --if-exists -d "<DATABASE_URL destino>" crm.dump
#      (ou restaurar so uma tabela: pg_restore ... -n public -t "NomeTabela" crm.dump)

name: Backup DB

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC todos os dias
  workflow_dispatch:

permissions:
  contents: read
  actions: write # para o passo "keepalive"

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Instalar pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump + encriptar
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Faltam os secrets BACKUP_DATABASE_URL e/ou BACKUP_PASSPHRASE"
            exit 1
          fi
          FILE="crm-$(date -u +%F).dump"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

          # So o schema "public" (dados do CRM); auth/storage sao geridos pelo Supabase.
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" \
            --schema=public --format=custom --compress=9 \
            --no-owner --no-privileges --file="$FILE"

          # Validar que o dump e legivel antes de o guardar
          /usr/lib/postgresql/17/bin/pg_restore --list "$FILE" > /dev/null
          echo "Tamanho do dump: $(du -h "$FILE" | cut -f1)"

          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "$FILE.gpg" "$FILE" <<< "$BACKUP_PASSPHRASE"
          rm -f "$FILE"

      - name: Guardar artifact (10 dias)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.FILE }}
          path: ${{ env.FILE }}.gpg
          retention-days: 10
          compression-level: 0
          if-no-files-found: error

      # O GitHub desativa workflows agendados em repos publicos apos 60 dias sem
      # commits. Reativar o proprio workflow reinicia essa contagem.
      - name: Keepalive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/backup-db.yml/enable"
